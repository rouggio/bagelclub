<!doctype html>
<html lang="it">
 <head>
 <meta charset="UTF-8" />
 <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bagel Club — Tennis & Padel Booking</title>
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <link rel="stylesheet" href="/src/styles.css" />
 </head>
 <body class="site-page min-h-screen antialiased">
 <div x-data="app()" x-init="init()" class="flex min-h-screen flex-col">
 <header class="site-header sticky top-0 z-30 backdrop-blur">
 <div class="mx-auto flex max-w-6xl items-center justify-between px-4 py-3">
  <a href="#" @click.prevent="isPlatform ? (view = platformUser ? 'platform-clubs' : 'platform-login') : (clubSlug ? (view='home', location.hash='home') : (location.pathname === '/clubs' ? (location.href='/') : (view='clubs', window.scrollTo(0, 0))))" class="flex items-center gap-2"><img src="/logo.svg" :alt="t('app.name')" alt="Bagel Club" class="h-8 w-8 rounded-lg shadow-sm" /><span class="text-lg font-bold tracking-tight" x-text="(clubSlug && clubInfo?.club_name) || t('app.name')">Bagel Club</span></a>
  <nav class="hidden gap-6 text-sm md:flex">
  <template x-if="clubSlug">
  <a href="#courts" class="hover:text-black" x-text="t('nav.courts')"></a>
  </template>
  <a href="#me" x-show="user && clubSlug" class="hover:text-black" x-text="t('nav.myBookings')"></a>
  <template x-if="isStaff() && clubSlug">
  <div class="flex gap-6">
   <a x-show="user?.role==='admin'" href="#admin-users" class="hover:text-black" x-text="t('admin.users')"></a>
   <a href="#admin-bookings" class="hover:text-black" x-text="t('admin.bookings')"></a>
   <div x-show="user?.role==='admin'" class="relative">
   <button @click="settingsMenuOpen=!settingsMenuOpen" class="flex items-center gap-1 hover:text-black"><span x-text="t('admin.menu.settings')"></span><span class="text-xs" x-text="settingsMenuOpen ? '▲' : '▼'"></span></button>
   <div x-show="settingsMenuOpen" @click.outside="settingsMenuOpen=false" class="absolute left-0 top-6 mt-1 w-48 rounded-lg border bg-white shadow-lg z-50 overflow-hidden">
   <a href="#admin-club" @click="settingsMenuOpen=false" class="block px-3 py-2 text-sm hover:bg-zinc-50" x-text="t('admin.club.title')"></a>
   <a href="#admin-params" @click="settingsMenuOpen=false" class="block px-3 py-2 text-sm hover:bg-zinc-50" x-text="t('admin.params.title')"></a>
   <a href="#admin-courts" @click="settingsMenuOpen=false" class="block px-3 py-2 text-sm hover:bg-zinc-50" x-text="t('admin.menu.courtsDef')"></a>
   <a href="#admin-timetable" @click="settingsMenuOpen=false" class="block px-3 py-2 text-sm hover:bg-zinc-50" x-text="t('admin.menu.slots')"></a>
   <a href="#admin-blocks" @click="settingsMenuOpen=false" class="block px-3 py-2 text-sm hover:bg-zinc-50" x-text="t('admin.blocks.short')"></a>
   <a href="#admin-notifications" @click="settingsMenuOpen=false" class="block px-3 py-2 text-sm hover:bg-zinc-50" x-text="t('admin.notifications.nav')"></a>
   <a href="#admin-announcements" @click="settingsMenuOpen=false" class="block px-3 py-2 text-sm hover:bg-zinc-50" x-text="t('admin.ann.title')"></a>
   </div>
   </div>
   <div x-show="user?.role==='admin'" class="relative">
   <button @click="reportingMenuOpen=!reportingMenuOpen" class="flex items-center gap-1 hover:text-black"><span x-text="t('admin.menu.reporting')"></span><span class="text-xs" x-text="reportingMenuOpen ? '▲' : '▼'"></span></button>
   <div x-show="reportingMenuOpen" @click.outside="reportingMenuOpen=false" class="absolute left-0 top-6 mt-1 w-48 rounded-lg border bg-white shadow-lg z-50 overflow-hidden">
   <a href="#admin-reports" @click="reportingMenuOpen=false" class="block px-3 py-2 text-sm hover:bg-zinc-50" x-text="t('admin.reports.title')"></a>
   <a href="#admin-fees" @click="reportingMenuOpen=false" class="block px-3 py-2 text-sm hover:bg-zinc-50" x-text="t('admin.fees.title')"></a>
   <a href="#admin-medcerts" @click="reportingMenuOpen=false" x-show="adminSettings?.require_medical_cert" class="block px-3 py-2 text-sm hover:bg-zinc-50" x-text="t('admin.medcerts.title')"></a>
   </div>
   </div>
   <a x-show="user?.role==='admin'" href="#admin-requests" class="hover:text-black" x-text="t('admin.requests.title')"></a>
   </div>
  </template>
  <template x-if="isPlatform && platformUser">
  <div class="flex gap-6">
  <a href="#platform" @click.prevent="view='platform-clubs'; loadPlatformClubs()" class="hover:text-black" x-text="t('platform.clubs')"></a>
  <a href="#platform" @click.prevent="view='platform-settings'; loadPlatformSettings()" class="hover:text-black" x-text="t('platform.settings')"></a>
  <a href="#platform" @click.prevent="view='platform-reports'; loadPlatformReports()" class="hover:text-black" x-text="t('platform.reports')"></a>
  <a href="#platform" @click.prevent="view='platform-audit'; loadPlatformClubs(); loadPlatformAudit()" class="hover:text-black" x-text="t('platform.audit')"></a>
  <a href="#platform" @click.prevent="view='platform-notifs'; loadPlatformSettings()" class="hover:text-black" x-text="t('platform.notifs.title')"></a>
  <a href="#platform" @click.prevent="view='platform-requests'; loadPlatformRequests()" class="hover:text-black" x-text="t('platform.requests.title')"></a>
  </div>
  </template>
   </nav>
   <!-- Mobile admin dropdown (top, mobile only) -->
    <div x-show="isStaff() && clubSlug" class="md:hidden relative">
   <button @click="adminMobileOpen=!adminMobileOpen" class="flex items-center gap-1 rounded-lg border bg-white px-3 py-2 text-xs font-medium">Admin <span x-text="adminMobileOpen ? '▲' : '▼'"></span></button>
    <div x-show="adminMobileOpen" @click.outside="adminMobileOpen=false" class="absolute left-0 top-10 mt-1 w-56 rounded-lg border bg-white shadow-lg z-50 overflow-hidden">
     <a x-show="user?.role==='admin'" href="#admin-users" @click="adminMobileOpen=false" class="block px-3 py-2 text-sm hover:bg-zinc-50" x-text="t('admin.users')"></a>
     <a href="#admin-bookings" @click="adminMobileOpen=false" class="block px-3 py-2 text-sm hover:bg-zinc-50" x-text="t('admin.bookings')"></a>
    <template x-if="user?.role==='admin'">
    <div class="contents">
    <div class="px-3 pt-2 text-xs font-semibold text-zinc-500" x-text="t('admin.menu.settings')"></div>
     <a href="#admin-club" @click="adminMobileOpen=false" class="block px-5 py-2 text-sm hover:bg-zinc-50" x-text="t('admin.club.title')"></a>
     <a href="#admin-params" @click="adminMobileOpen=false" class="block px-5 py-2 text-sm hover:bg-zinc-50" x-text="t('admin.params.title')"></a>
     <a href="#admin-courts" @click="adminMobileOpen=false" class="block px-5 py-2 text-sm hover:bg-zinc-50" x-text="t('admin.menu.courtsDef')"></a>
     <a href="#admin-timetable" @click="adminMobileOpen=false" class="block px-5 py-2 text-sm hover:bg-zinc-50" x-text="t('admin.menu.slots')"></a>
     <a href="#admin-blocks" @click="adminMobileOpen=false" class="block px-5 py-2 text-sm hover:bg-zinc-50" x-text="t('admin.blocks.short')"></a>
     <a href="#admin-notifications" @click="adminMobileOpen=false" class="block px-5 py-2 text-sm hover:bg-zinc-50" x-text="t('admin.notifications.nav')"></a>
     <a href="#admin-announcements" @click="adminMobileOpen=false" class="block px-5 py-2 text-sm hover:bg-zinc-50" x-text="t('admin.ann.title')"></a>
    <div class="px-3 pt-2 text-xs font-semibold text-zinc-500" x-text="t('admin.menu.reporting')"></div>
     <a href="#admin-reports" @click="adminMobileOpen=false" class="block px-5 py-2 text-sm hover:bg-zinc-50" x-text="t('admin.reports.title')"></a>
     <a href="#admin-fees" @click="adminMobileOpen=false" class="block px-5 py-2 text-sm hover:bg-zinc-50" x-text="t('admin.fees.title')"></a>
     <a href="#admin-medcerts" @click="adminMobileOpen=false" x-show="adminSettings?.require_medical_cert" class="block px-5 py-2 text-sm hover:bg-zinc-50" x-text="t('admin.medcerts.title')"></a>
     <a href="#admin-requests" @click="adminMobileOpen=false" class="block px-3 py-2 text-sm hover:bg-zinc-50" x-text="t('admin.requests.title')"></a>
    </div>
    </template>
   </div>
   </div>
  <div class="flex items-center gap-2">
  <template x-if="!user && clubLocales.length !== 1">
  <div class="flex items-center gap-2 relative">
  <button @click="headerLangOpen=!headerLangOpen" class="flex items-center gap-2 rounded-lg border bg-white px-4 py-2 text-sm font-medium">
  <img :src="flagUrl(lang)" class="h-3 w-4 object-cover rounded-sm" :alt="lang" />
  <span x-text="t('lang.'+lang)"></span>
  </button>
  <div x-show="headerLangOpen" @click.outside="headerLangOpen=false" class="absolute right-0 top-10 mt-1 w-44 rounded-lg border bg-white shadow-lg z-50 overflow-hidden">
  <template x-for="l in (clubLocales.length ? clubLocales : ['it','en','fr','de','es'])" :key="l">
 <button @click="setLang(l); headerLangOpen=false" class="flex w-full items-center gap-2 px-3 py-2 text-xs hover:bg-zinc-50 text-left">
 <img :src="flagUrl(l)" class="h-3 w-4 object-cover rounded-sm" :alt="l" />
 <span x-text="t('lang.'+l)"></span>
 </button>
 </template>
 </div>
 </div>
 </template>
  <a href="#profile" x-show="user && clubSlug && !impSession" class="hidden text-sm font-medium text-zinc-700 hover:text-black md:inline" x-text="user?.username" @click.prevent="view='profile'; location.hash='profile'; loadProfile()"></a>
  <button x-show="!user && clubSlug" @click="view='login'" class="rounded-lg bg-emerald-200 border border-emerald-300 text-emerald-900 hover:bg-emerald-300 px-4 py-2 text-sm font-medium" x-text="t('nav.login')"></button>
  <button x-show="user || platformUser" @click="isPlatform ? platformLogout() : logout()" class="rounded-lg border px-4 py-2 text-sm" x-text="t('nav.logout')"></button>
 </div>
 </div>
  </header>

  <div x-cloak x-show="impSession" class="bg-red-700 px-4 py-2 text-center text-xs font-semibold text-white">
  <span x-text="t('imp.banner')"></span>
  <span x-text="impCountdown()"></span>
  <button @click="endImpersonation()" class="ml-3 underline" x-text="t('imp.end')"></button>
  </div>

  <nav x-show="clubSlug" class="fixed inset-x-0 bottom-0 z-30 flex border-t bg-white px-2 py-2 md:hidden">
  <a href="#courts" class="flex flex-1 flex-col items-center text-xs whitespace-nowrap" x-text="t('nav.courts')"></a>
  <a href="#me" class="flex flex-1 flex-col items-center text-xs whitespace-nowrap" x-text="t('nav.myBookings')"></a>
  <a href="#profile" x-show="user && !impSession" class="flex flex-1 flex-col items-center text-xs whitespace-nowrap" x-text="t('nav.profile')"></a>
  </nav>
  <nav x-show="isPlatform && platformUser" class="fixed inset-x-0 bottom-0 z-30 flex border-t bg-white px-2 py-2 md:hidden">
  <a href="#platform" @click.prevent="view='platform-clubs'; loadPlatformClubs()" class="flex flex-1 flex-col items-center text-xs whitespace-nowrap" x-text="t('platform.clubs')"></a>
  <a href="#platform" @click.prevent="view='platform-settings'; loadPlatformSettings()" class="flex flex-1 flex-col items-center text-xs whitespace-nowrap" x-text="t('platform.settings')"></a>
  <a href="#platform" @click.prevent="view='platform-reports'; loadPlatformReports()" class="flex flex-1 flex-col items-center text-xs whitespace-nowrap" x-text="t('platform.reports')"></a>
  <a href="#platform" @click.prevent="view='platform-audit'; loadPlatformClubs(); loadPlatformAudit()" class="flex flex-1 flex-col items-center text-xs whitespace-nowrap" x-text="t('platform.audit')"></a>
  </nav>

  <main class="mx-auto w-full max-w-6xl flex-1 px-4 py-6 pb-20 md:pb-6">
  <section x-show="view==='clubs'" class="space-y-6">
  <div class="hero-gradient rounded-2xl p-8">
  <h1 class="text-3xl font-bold md:text-4xl" x-text="t('landing.title')"></h1>
  <p class="mt-2 max-w-xl/90" x-text="t('landing.sub')"></p>
  <div class="mt-4 flex flex-wrap gap-2">
  <a href="/club/demo/" class="inline-block rounded-lg bg-white px-6 py-2 text-sm font-semibold text-emerald-700" x-text="t('landing.tryDemo')"></a>
  <a href="#demo" @click.prevent="view='demo'" class="inline-block rounded-lg bg-white px-6 py-2 text-sm font-semibold text-emerald-700" x-text="t('landing.ownDemo')"></a>
  </div>
  </div>
  <div class="grid gap-3 md:grid-cols-3">
  <div class="rounded-xl border bg-white p-4"><div class="font-semibold" x-text="t('landing.f1')"></div><p class="mt-1 text-sm text-zinc-600" x-text="t('landing.f1d')"></p></div>
  <div class="rounded-xl border bg-white p-4"><div class="font-semibold" x-text="t('landing.f2')"></div><p class="mt-1 text-sm text-zinc-600" x-text="t('landing.f2d')"></p></div>
  <div class="rounded-xl border bg-white p-4"><div class="font-semibold" x-text="t('landing.f3')"></div><p class="mt-1 text-sm text-zinc-600" x-text="t('landing.f3d')"></p></div>
  <div class="rounded-xl border bg-white p-4"><div class="font-semibold" x-text="t('landing.f4')"></div><p class="mt-1 text-sm text-zinc-600" x-text="t('landing.f4d')"></p></div>
  <div class="rounded-xl border bg-white p-4"><div class="font-semibold" x-text="t('landing.f5')"></div><p class="mt-1 text-sm text-zinc-600" x-text="t('landing.f5d')"></p></div>
  <div class="rounded-xl border bg-white p-4"><div class="font-semibold" x-text="t('landing.f6')"></div><p class="mt-1 text-sm text-zinc-600" x-text="t('landing.f6d')"></p></div>
  </div>
  <h2 class="text-xl font-bold" x-text="t('landing.pricing')"></h2>
  <div class="grid gap-3 md:grid-cols-3">
  <div class="rounded-xl border bg-white p-4"><div class="font-semibold" x-text="t('landing.pFree')"></div><div class="text-sm text-zinc-600" x-text="t('landing.pFreeD')"></div></div>
  <div class="rounded-xl border bg-white p-4"><div class="font-semibold" x-text="t('landing.pStarter')"></div><div class="text-sm text-zinc-600" x-text="t('landing.pStarterD')"></div></div>
  <div class="rounded-xl border bg-white p-4"><div class="font-semibold" x-text="t('landing.pPro')"></div><div class="text-sm text-zinc-600" x-text="t('landing.pProD')"></div></div>
  </div>
  </section>
  <section x-show="view==='directory'" class="space-y-4">
  <h2 class="text-xl font-bold" x-text="t('landing.dir')"></h2>
  <div x-show="clubsLoading" class="text-sm text-zinc-500">…</div>
  <div class="space-y-3">
  <template x-for="c in clubsList" :key="c.slug">
  <a :href="`/club/${c.slug}/`" class="block rounded-xl border bg-white p-4 hover:border-emerald-300">
  <div class="font-semibold" x-text="c.name"></div>
  <div class="text-xs text-zinc-500" x-text="`/club/${c.slug}/`"></div>
  </a>
  </template>
  </div>
  <div x-show="!clubsLoading && !clubsList.length" class="text-sm text-zinc-500">No clubs yet.</div>
  </section>
  <section x-show="view==='demo'" class="mx-auto max-w-md space-y-4 rounded-xl border bg-white p-6">
  <h2 class="text-lg font-bold" x-text="t('demo.title')"></h2>
  <div x-show="!demoResult" class="space-y-3">
  <label class="block text-sm font-medium" x-text="t('demo.name')"></label>
  <div class="flex gap-2">
  <input x-model="demoForm.name" class="flex-1 rounded-lg border px-3 py-2 text-sm" />
  <button @click="surpriseDemoName()" class="rounded-lg border px-3 py-2 text-xs" x-text="t('demo.surprise')"></button>
  </div>
  <div class="grid grid-cols-2 gap-3">
  <label class="block text-sm"><span x-text="t('demo.tennis')"></span><input x-model.number="demoForm.tennis" type="number" min="0" max="6" class="mt-1 w-full rounded-lg border px-3 py-2" /></label>
  <label class="block text-sm"><span x-text="t('demo.padel')"></span><input x-model.number="demoForm.padel" type="number" min="0" max="6" class="mt-1 w-full rounded-lg border px-3 py-2" /></label>
  </div>
  <button @click="startDemo()" :disabled="demoLoading" class="w-full rounded-lg bg-emerald-200 border border-emerald-300 text-emerald-900 hover:bg-emerald-300 py-2 font-medium" x-text="t('demo.start')"></button>
  <div x-show="demoError" class="text-sm text-red-600" x-text="demoError"></div>
  </div>
  <div x-show="demoResult" class="space-y-2 text-sm">
  <div class="font-semibold" x-text="demoResult?.name"></div>
  <div><span class="text-zinc-500" x-text="t('demo.user') + ': '"></span><span class="font-mono" x-text="demoResult?.admin_username"></span></div>
  <div><span class="text-zinc-500" x-text="t('demo.pass') + ': '"></span><span class="font-mono" x-text="demoResult?.admin_password"></span></div>
  <div class="text-xs text-zinc-500" x-text="t('demo.expires') + ': ' + demoResult?.expires_at"></div>
  <a :href="demoResult?.url" class="inline-block rounded-lg bg-emerald-200 border border-emerald-300 text-emerald-900 px-6 py-2 font-medium" x-text="t('demo.open')"></a>
  </div>
  </section>
  <section x-show="view==='platform-login'" class="mx-auto max-w-sm space-y-4 rounded-xl border bg-white p-6">
  <h2 class="text-lg font-bold" x-text="t('platform.title')"></h2>
  <form @submit.prevent="platformLogin()" x-show="!platformChallenge" class="space-y-4">
  <input x-model="platformForm.username" autocomplete="username" class="w-full rounded-lg border px-3 py-2 text-sm" />
  <input x-model="platformForm.password" type="password" autocomplete="current-password" class="w-full rounded-lg border px-3 py-2 text-sm" />
  <button type="submit" class="w-full rounded-lg bg-emerald-200 border border-emerald-300 text-emerald-900 py-2 font-medium" x-text="t('platform.login')"></button>
  </form>
  <button @click="view='reset-request'; resetRequestSent=false; resetError=''" class="w-full text-sm text-zinc-600" x-text="t('auth.forgot')"></button>
  <form @submit.prevent="platformVerify2fa()" x-show="platformChallenge" class="space-y-4">
  <p class="text-sm text-zinc-600" x-text="t('platform.codeHint')"></p>
  <input x-model="platformCode" data-code-input inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="••••••" class="w-full rounded-lg border px-3 py-2 text-center text-lg tracking-widest font-mono" />
  <button type="submit" class="w-full rounded-lg bg-emerald-200 border border-emerald-300 text-emerald-900 py-2 font-medium" x-text="t('platform.verify')"></button>
  </form>
  <div x-show="platformError" class="text-sm text-red-600 whitespace-pre-line" x-text="platformError"></div>
  </section>
  <section x-show="view==='platform-clubs'" class="space-y-4">
  <div class="flex flex-wrap items-center justify-between gap-2">
  <h2 class="text-xl font-bold" x-text="t('platform.clubs')"></h2>
  <div class="flex gap-2">
  <button @click="view='platform-new'" class="rounded-lg bg-emerald-200 border border-emerald-300 text-emerald-900 px-4 py-2 text-sm" x-text="t('platform.new')"></button>
  </div>
  </div>
  <div x-show="platformError" class="text-sm text-red-600 whitespace-pre-line rounded-lg border border-red-200 bg-red-50 p-3" x-text="platformError"></div>
  <div class="space-y-3">
  <template x-for="c in platformClubs" :key="c.id">
  <div class="rounded-xl border bg-white p-4">
  <div class="flex flex-wrap items-center justify-between gap-2">
  <div><a :href="`/club/${c.slug}/`" class="font-semibold underline" x-text="c.name"></a>
  <div class="text-xs text-zinc-500" x-text="`${c.timezone} · ${c.plan} · courts ${c.counts?.courts ?? '?'} · users ${c.counts?.users ?? '?'} · bookings ${c.counts?.bookings ?? '?'}`"></div></div>
  <div class="flex flex-wrap items-center gap-2 text-xs">
  <input x-model="c.slugEdit" :placeholder="t('platform.slug')" class="w-32 rounded-lg border px-2 py-1 font-mono" />
  <select x-model="c.plan" class="rounded-lg border px-2 py-1"><option value="free">free</option><option value="starter">starter</option><option value="pro">pro</option></select>
  <label class="flex items-center gap-1"><input type="checkbox" x-model="c.isActive" /><span x-text="t('platform.active')"></span></label>
  <label class="flex items-center gap-1"><input type="checkbox" x-model="c.isListed" /><span x-text="t('platform.listed')"></span></label>
  <button @click="savePlatformClub(c)" class="rounded-lg border px-2 py-1" x-text="t('platform.save')"></button>
  <button @click="accessClubAsAdmin(c.slug)" class="rounded-lg border border-red-300 bg-red-50 px-2 py-1" x-text="t('platform.access')"></button>
  <button x-show="c.slug!=='demo'" @click="deletePlatformClub(c)" class="rounded-lg border border-red-300 bg-red-50 px-2 py-1" x-text="t('platform.delete')"></button>
  </div>
  </div>
  </div>
  </template>
  </div>
  </section>
  <section x-show="view==='platform-new'" class="mx-auto max-w-md space-y-3 rounded-xl border bg-white p-6">
  <h2 class="text-lg font-bold" x-text="t('platform.new')"></h2>
  <label class="block text-sm"><span x-text="t('platform.name')"></span><input x-model="platformNew.name" class="mt-1 w-full rounded-lg border px-3 py-2" /></label>
  <label class="block text-sm"><span x-text="t('platform.slug')"></span><input x-model="platformNew.slug" placeholder="auto" class="mt-1 w-full rounded-lg border px-3 py-2" /></label>
  <label class="block text-sm"><span x-text="t('platform.timezone')"></span><input x-model="platformNew.timezone" class="mt-1 w-full rounded-lg border px-3 py-2" /></label>
  <label class="block text-sm"><span x-text="t('platform.plan')"></span><select x-model="platformNew.plan" class="mt-1 w-full rounded-lg border px-3 py-2"><option value="free">free</option><option value="starter">starter</option><option value="pro">pro</option></select></label>
  <label class="block text-sm"><span x-text="t('platform.adminUser')"></span><input x-model="platformNew.admin_username" class="mt-1 w-full rounded-lg border px-3 py-2" /></label>

  <section x-show="view==='admin-announcements'" class="mx-auto max-w-2xl space-y-4 rounded-xl border bg-white p-6">
  <div class="flex items-center gap-2">
  <h2 class="text-xl font-bold" x-text="t('admin.ann.title')"></h2>
  <button @click="newAnnouncement()" class="ml-auto rounded bg-emerald-200 border border-emerald-300 text-emerald-900 hover:bg-emerald-300 px-3 py-1 text-xs" x-text="t('admin.ann.new')"></button>
  </div>
  <p class="text-xs text-zinc-500" x-text="t('admin.ann.desc')"></p>
  <p x-show="adminAnnLoading" class="text-sm text-zinc-500" x-text="t('myBookings.loading')"></p>
  <p x-show="adminAnnError" class="text-sm text-red-600 whitespace-pre-line" x-text="adminAnnError"></p>
  <p x-show="adminAnnSuccess" class="text-sm text-emerald-600" x-text="adminAnnSuccess"></p>
  <p x-show="!adminAnnLoading && adminAnns.length===0" class="text-xs text-zinc-500 text-center" x-text="t('admin.ann.empty')"></p>
  <div class="space-y-2">
  <template x-for="(a, i) in adminAnns" :key="a.id">
  <div class="rounded-xl border bg-white px-3 py-2">
  <div class="grid grid-cols-[1fr_auto] items-start gap-2">
  <div class="grid gap-0.5 text-sm">
  <div class="font-semibold leading-tight" x-text="a.title"></div>
  <div class="text-xs text-zinc-500" x-text="(a.publish_start || '…') + ' → ' + (a.publish_end || '…')"></div>
  <div class="flex gap-1">
  <span class="rounded-lg px-2 py-0.5 text-[11px] font-medium" :class="a.visibility==='members' ? 'bg-emerald-100 text-emerald-700' : 'bg-zinc-100 text-zinc-600'" x-text="a.visibility==='members' ? t('admin.ann.members') : t('admin.ann.public')"></span>
  <span class="rounded-lg px-2 py-0.5 text-[11px] font-medium" :class="annStatus(a)==='active' ? 'bg-emerald-100 text-emerald-700' : annStatus(a)==='scheduled' ? 'bg-amber-100 text-amber-700' : 'bg-zinc-200 text-zinc-600'" x-text="annStatus(a)==='active' ? t('admin.ann.active') : annStatus(a)==='scheduled' ? t('admin.ann.scheduled') : t('admin.ann.expired')"></span>
  </div>
  <p class="text-xs text-zinc-600 whitespace-pre-line" x-text="a.body"></p>
  </div>
  <div class="flex flex-col items-end gap-1">
  <div class="flex gap-1">
  <button @click="moveAnnouncement(a.id, -1)" :disabled="i===0" :title="t('admin.ann.moveUp')" class="rounded-lg border bg-white px-2 py-1 text-xs disabled:opacity-40">▲</button>
  <button @click="moveAnnouncement(a.id, 1)" :disabled="i===adminAnns.length-1" :title="t('admin.ann.moveDown')" class="rounded-lg border bg-white px-2 py-1 text-xs disabled:opacity-40">▼</button>
  </div>
  <div class="flex gap-1">
  <button @click="startEditAnnouncement(a)" class="rounded-lg border bg-white px-2 py-1 text-xs" x-text="t('btn.edit')"></button>
  <button @click="deleteAnnouncement(a.id)" class="rounded-lg border bg-white px-2 py-1 text-xs text-red-600" x-text="t('btn.delete')"></button>
  </div>
  </div>
  </div>
  </div>
  </template>
  </div>
  </section>

  <section x-show="view==='admin-announcement-form'" class="mx-auto max-w-2xl space-y-4 rounded-xl border bg-white p-6">
  <div class="flex items-center gap-2">
  <button @click="view='admin-announcements'; location.hash='admin-announcements'" class="rounded-lg border bg-white px-3 py-1 text-xs" x-text="t('btn.back')"></button>
  <h2 class="text-xl font-bold" x-text="editingAnnId ? t('admin.ann.edit') : t('admin.ann.new')"></h2>
  </div>
  <p x-show="adminAnnError" class="text-sm text-red-600 whitespace-pre-line" x-text="adminAnnError"></p>
  <p x-show="adminAnnSuccess" class="text-sm text-emerald-600" x-text="adminAnnSuccess"></p>
  <div class="space-y-3">
  <input x-model="annForm.title" :placeholder="t('admin.ann.titlePh')" class="w-full rounded-lg border px-3 py-2 text-sm" />
  <textarea x-model="annForm.body" rows="3" :placeholder="t('admin.ann.bodyPh')" class="w-full rounded-lg border px-3 py-2 text-sm"></textarea>
  <template x-for="l in ['en','fr','de','es']" :key="l">
  <div class="space-y-2 border-t pt-2">
  <div class="flex items-center gap-2 text-xs font-medium"><img :src="flagUrl(l)" class="h-3 w-4 object-cover rounded-sm" :alt="l" /><span x-text="t('lang.'+l)"></span><span class="text-zinc-400 font-normal" x-text="'(' + t('common.optional') + ')'"></span></div>
  <input x-model="annForm.tr[l].title" :placeholder="t('admin.ann.titlePh')" class="w-full rounded-lg border px-3 py-2 text-sm" />
  <textarea x-model="annForm.tr[l].body" rows="2" :placeholder="t('admin.ann.bodyPh')" class="w-full rounded-lg border px-3 py-2 text-sm"></textarea>
  </div>
  </template>
  <div>
  <label class="text-xs text-zinc-500" x-text="t('admin.ann.visibility')"></label>
  <select x-model="annForm.visibility" class="w-full rounded-lg border px-3 py-2 text-sm">
  <option value="public" x-text="t('admin.ann.public')"></option>
  <option value="members" x-text="t('admin.ann.members')"></option>
  </select>
  </div>
  <div class="grid grid-cols-2 gap-2">
  <div>
  <label class="text-xs text-zinc-500" x-text="t('admin.ann.start')"></label>
  <input type="date" x-model="annForm.publish_start" class="w-full rounded-lg border px-3 py-2 text-sm" />
  </div>
  <div>
  <label class="text-xs text-zinc-500" x-text="t('admin.ann.end')"></label>
  <input type="date" x-model="annForm.publish_end" class="w-full rounded-lg border px-3 py-2 text-sm" />
  </div>
  </div>
  <div class="flex gap-2">
  <button x-show="!editingAnnId" @click="createAnnouncement()" class="flex-1 rounded-lg bg-emerald-200 border border-emerald-300 text-emerald-900 hover:bg-emerald-300 py-2 text-sm font-medium" x-text="t('btn.create')"></button>
  <button x-show="editingAnnId" @click="updateAnnouncement()" class="flex-1 rounded-lg bg-emerald-200 border border-emerald-300 text-emerald-900 hover:bg-emerald-300 py-2 text-sm font-medium" x-text="t('btn.update')"></button>
  <button @click="cancelEditAnnouncement()" class="rounded-lg border bg-white px-4 py-2 text-sm" x-text="t('btn.cancel')"></button>
  </div>
  </div>
  </section>

  <section x-show="view==='admin-requests'" class="mx-auto max-w-2xl space-y-4">
  <h2 class="text-xl font-bold" x-text="t('admin.requests.title')"></h2>
  <p class="text-xs text-zinc-500" x-text="t('admin.requests.desc')"></p>
  <div class="space-y-3 rounded-xl border bg-white p-4">
  <input x-model="featureRequestForm.title" maxlength="200" :placeholder="t('admin.requests.titlePh')" class="w-full rounded-lg border px-3 py-2 text-sm" />
  <textarea x-model="featureRequestForm.body" rows="3" maxlength="5000" :placeholder="t('admin.requests.bodyPh')" class="w-full rounded-lg border px-3 py-2 text-sm"></textarea>
  <button @click="submitFeatureRequest()" class="w-full rounded-lg bg-emerald-200 border border-emerald-300 text-emerald-900 hover:bg-emerald-300 py-2 text-sm font-medium" x-text="t('admin.requests.submit')"></button>
  </div>
  <p x-show="featureRequestsError" class="text-sm text-red-600 whitespace-pre-line" x-text="featureRequestsError"></p>
  <p x-show="featureRequestsMsg" class="text-sm text-emerald-600" x-text="featureRequestsMsg"></p>
  <p x-show="featureRequestsLoading" class="text-sm text-zinc-500" x-text="t('myBookings.loading')"></p>
  <p x-show="!featureRequestsLoading && featureRequests.length===0" class="text-xs text-zinc-500 text-center" x-text="t('admin.requests.empty')"></p>
  <div class="space-y-2">
  <template x-for="r in featureRequests" :key="r.id">
  <div class="rounded-xl border bg-white px-3 py-2">
  <div class="grid grid-cols-[1fr_auto] items-start gap-2">
  <div class="grid gap-0.5 text-sm">
  <div class="flex flex-wrap items-center gap-1">
  <span class="font-semibold leading-tight" x-text="r.title"></span>
  <span x-show="r.mine" class="rounded-lg px-2 py-0.5 text-[11px] font-medium bg-sky-100 text-sky-700" x-text="t('admin.requests.mine')"></span>
  </div>
  <div class="flex items-center gap-1">
  <span class="rounded-lg px-2 py-0.5 text-[11px] font-medium" :class="reqStatusClass(r.status)" x-text="t('admin.requests.status.'+r.status)"></span>
  <span class="text-xs text-zinc-500" x-text="'+' + r.votes"></span>
  </div>
  <p class="text-xs text-zinc-600 whitespace-pre-line" x-text="r.body"></p>
  <div x-show="r.reply" class="text-xs italic text-emerald-700 bg-emerald-50 px-2 py-1 rounded"><span class="font-medium not-italic" x-text="t('admin.requests.reply') + ': '"></span><span x-text="r.reply"></span></div>
  <div x-show="editingRequestId===r.id" class="space-y-2 border-t pt-2">
  <input x-model="editRequestForm.title" maxlength="200" :placeholder="t('admin.requests.titlePh')" class="w-full rounded-lg border px-2 py-1 text-sm" />
  <textarea x-model="editRequestForm.body" rows="2" maxlength="5000" :placeholder="t('admin.requests.bodyPh')" class="w-full rounded-lg border px-2 py-1 text-sm"></textarea>
  <div class="flex gap-2">
  <button @click="saveEditRequest()" class="rounded-lg bg-emerald-200 border border-emerald-300 text-emerald-900 px-3 py-1 text-xs" x-text="t('admin.requests.update')"></button>
  <button @click="cancelEditRequest()" class="rounded-lg border px-3 py-1 text-xs" x-text="t('admin.requests.cancel')"></button>
  </div>
  </div>
  </div>
  <div class="flex flex-col items-end gap-1">
  <button x-show="!r.mine" @click="toggleRequestVote(r)" class="rounded-lg border px-3 py-1 text-xs font-medium" :class="r.voted ? 'bg-emerald-200 border-emerald-300 text-emerald-900' : 'bg-white hover:bg-zinc-50'" x-text="r.voted ? t('admin.requests.voted') : t('admin.requests.vote')"></button>
  <button x-show="r.mine && r.status==='open'" @click="startEditRequest(r)" class="rounded-lg border bg-white px-2 py-1 text-xs" x-text="t('admin.requests.edit')"></button>
  </div>
  </div>
  </div>
  </template>
  </div>
  </section>
  <section x-show="view==='admin-fees'" class="mx-auto max-w-2xl space-y-4">
  <h2 class="text-xl font-bold" x-text="t('admin.fees.title')"></h2>
  <p class="text-xs text-zinc-500" x-text="t('admin.fees.desc')"></p>
  <div class="space-y-3 rounded-xl border bg-white p-4">
  <div class="grid grid-cols-2 gap-3">
  <label class="block text-sm"><span x-text="t('admin.fees.amount')"></span><input x-model="feeForm.eur" inputmode="decimal" :placeholder="t('admin.fees.amountPh')" class="mt-1 w-full rounded-lg border px-3 py-2" /></label>
  <label class="block text-sm"><span x-text="t('admin.fees.cadence')"></span><select x-model="feeForm.cadence" class="mt-1 w-full rounded-lg border px-3 py-2">
  <option value="monthly" x-text="t('admin.fees.cMonthly')"></option>
  <option value="bimonthly" x-text="t('admin.fees.cBimonthly')"></option>
  <option value="semestral" x-text="t('admin.fees.cSemestral')"></option>
  <option value="yearly" x-text="t('admin.fees.cYearly')"></option>
  </select></label>
  </div>
  <label class="flex items-center gap-2 text-sm"><input type="checkbox" x-model="feeForm.notify" /><span x-text="t('admin.fees.notify')"></span></label>
  <label class="flex items-center gap-2 text-sm"><input type="checkbox" x-model="feeForm.block" /><span x-text="t('admin.fees.block')"></span></label>
  <button @click="saveFeeConfig()" class="w-full rounded-lg bg-emerald-200 border border-emerald-300 text-emerald-900 hover:bg-emerald-300 py-2 text-sm font-medium" x-text="t('admin.fees.save')"></button>
  </div>
  <div x-show="fees" class="space-y-3">
  <div class="flex items-center justify-between rounded-xl border bg-white px-3 py-2">
  <button @click="shiftFeePeriod(-1)" class="rounded-lg border px-3 py-1 text-sm">←</button>
  <div class="text-sm font-medium" x-text="`${fees?.period_start} → ${fees?.period_end_exclusive}`"></div>
  <button @click="shiftFeePeriod(1)" class="rounded-lg border px-3 py-1 text-sm">→</button>
  </div>
  <div x-show="fees && !fees.fee_active" class="text-sm text-zinc-500" x-text="t('admin.fees.off')"></div>
  <div x-show="fees && fees.fee_active" class="text-sm text-zinc-600" x-text="`${fees?.fee_display} · ${t('admin.fees.totals')}: ${fees?.totals.paid}/${fees?.totals.owing} · ${t('admin.fees.overdue')}: ${fees?.totals.overdue}`"></div>
  <div class="space-y-2">
  <template x-for="u in fees?.users || []" :key="u.id">
  <div class="flex items-center justify-between gap-2 rounded-xl border bg-white px-3 py-2 text-sm">
  <div>
  <div class="font-medium" x-text="u.name"></div>
  <div class="text-xs text-zinc-500" x-text="u.email || u.username"></div>
  </div>
  <div class="flex items-center gap-2">
  <span class="rounded px-2 py-1 text-xs" :class="u.exempt ? 'bg-zinc-100 text-zinc-600' : u.paid ? 'bg-emerald-100 text-emerald-700' : u.overdue ? 'bg-red-100 text-red-700' : 'bg-amber-100 text-amber-700'" x-text="u.exempt ? t('admin.fees.exempt') : u.paid ? t('admin.fees.paid') : u.overdue ? `${t('admin.fees.overdue')} +${u.days_overdue}` : t('admin.fees.unpaid')"></span>
  <label x-show="fees?.fee_active" class="flex items-center gap-1 text-xs text-zinc-500" :title="t('admin.fees.exempt')"><input type="checkbox" :checked="u.exempt" @change="toggleFeeExempt(u)" /><span x-text="t('admin.fees.exemptShort')"></span></label>
  <button x-show="fees?.fee_active && !u.exempt && !u.paid" @click="collectFee(u)" class="rounded border px-2 py-1 text-xs text-emerald-700" x-text="t('admin.fees.mark')"></button>
  <button x-show="fees?.fee_active && !u.exempt && u.paid" @click="uncollectFee(u)" class="rounded border px-2 py-1 text-xs text-zinc-500" x-text="t('admin.fees.unmark')"></button>
  </div>
  </div>
  </template>
  </div>
  </div>
  <p x-show="feesError" class="text-sm text-red-600 whitespace-pre-line" x-text="feesError"></p>
  <p x-show="feesMsg" class="text-sm text-emerald-600" x-text="feesMsg"></p>
  <p x-show="feesLoading" class="text-sm text-zinc-500" x-text="t('myBookings.loading')"></p>
  </section>
  <section x-show="view==='admin-medcerts'" class="mx-auto max-w-2xl space-y-4">
  <h2 class="text-xl font-bold" x-text="t('admin.medcerts.title')"></h2>
  <p class="text-xs text-zinc-500" x-text="t('admin.medcerts.desc')"></p>
  <div x-show="medcerts" class="text-sm text-zinc-600" x-text="`${t('admin.medcert.expired')}: ${medcerts?.totals.expired} · ${t('admin.medcert.expiring')}: ${medcerts?.totals.expiring} · ${t('admin.medcert.missing')}: ${medcerts?.totals.missing}`"></div>
  <div x-show="medcerts && !medcerts.required" class="text-sm text-zinc-500" x-text="t('admin.medcerts.off')"></div>
  <p x-show="medcertsError" class="text-sm text-red-600" x-text="medcertsError"></p>
  <p x-show="medcertsLoading" class="text-sm text-zinc-500" x-text="t('myBookings.loading')"></p>
  <div class="space-y-2">
  <template x-for="u in medcerts?.users || []" :key="u.id">
  <div @click="viewUserById(u.id)" class="flex items-center justify-between gap-2 rounded-xl border bg-white px-3 py-2 text-sm cursor-pointer hover:bg-zinc-50">
  <div>
  <div class="font-medium" x-text="`${u.name} (${u.username})`"></div>
  <div class="text-xs text-zinc-500" x-text="u.expires_at ? t('admin.medcert.expires') + ' ' + u.expires_at : t('admin.medcert.missing')"></div>
  </div>
  <span class="rounded px-2 py-1 text-xs" :class="certClass(u.status)" x-text="t('admin.medcert.'+u.status)"></span>
  </div>
  </template>
  </div>
  <p x-show="medcerts && !medcertsLoading && !(medcerts?.users || []).some(u => u.status !== 'valid')" class="text-xs text-zinc-500 text-center" x-text="t('admin.medcerts.empty')"></p>
  </section>
   </main>

   <footer class="site-footer px-4 py-4 text-center text-xs text-zinc-500" x-text="clubSlug ? `${clubInfo?.club_name || 'Green Village'} - tel. ${clubInfo?.club_phone || '3923047417'}${clubInfo?.club_address ? ' - ' + clubInfo.club_address : ''}` : (platformFooter || t('footer'))"></footer>
 </div>
