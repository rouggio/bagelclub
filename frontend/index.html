<!doctype html>
<html lang="it">
 <head>
 <meta charset="UTF-8" />
 <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bagel Club — Tennis & Padel Booking</title>
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <link rel="stylesheet" href="/src/styles.css" />
 </head>
 <body class="site-page min-h-screen antialiased">
 <div x-data="app()" x-init="init()" class="flex min-h-screen flex-col">
 <header class="site-header sticky top-0 z-30 backdrop-blur">
 <div class="mx-auto flex max-w-6xl items-center justify-between px-4 py-3">
  <a href="#" class="flex items-center gap-2"><img src="/logo.svg" :alt="t('app.name')" alt="Bagel Club" class="h-8 w-8 rounded-lg shadow-sm" /><span class="text-lg font-bold tracking-tight" x-text="t('app.name')">Bagel Club</span></a>
 <nav class="hidden gap-6 text-sm md:flex">
 <a href="#courts" class="hover:text-black" x-text="t('nav.courts')"></a>
 <a href="#me" x-show="user" class="hover:text-black" x-text="t('nav.myBookings')"></a>
 <template x-if="user?.role==='admin'">
 <div class="flex gap-6">
  <a href="#admin-courts" class="hover:text-black" x-text="t('admin.courts')"></a>
  <a href="#admin-timetable" class="hover:text-black" x-text="t('admin.timetable')"></a>
  <a href="#admin-users" class="hover:text-black" x-text="t('admin.users')"></a>
  <a href="#admin-bookings" class="hover:text-black" x-text="t('admin.bookings')"></a>
  <a href="#admin-blocks" class="hover:text-black" x-text="t('admin.blocks.short')"></a>
  <a href="#admin-club" class="hover:text-black" x-text="t('admin.club.title')"></a>
   <a href="#admin-reports" class="hover:text-black" x-text="t('admin.reports.title')"></a>
   <a href="#admin-notifications" class="hover:text-black" x-text="t('admin.notifications.nav')"></a>
   <a href="#admin-announcements" class="hover:text-black" x-text="t('admin.ann.title')"></a>
   </div>
  </template>
   </nav>
   <!-- Mobile admin dropdown (top, mobile only) -->
   <div x-show="user?.role==='admin'" class="md:hidden relative">
   <button @click="adminMobileOpen=!adminMobileOpen" class="flex items-center gap-1 rounded-lg border bg-white px-3 py-2 text-xs font-medium">Admin <span x-text="adminMobileOpen ? '▲' : '▼'"></span></button>
   <div x-show="adminMobileOpen" @click.outside="adminMobileOpen=false" class="absolute left-0 top-10 mt-1 w-56 rounded-lg border bg-white shadow-lg z-50 overflow-hidden">
    <a href="#admin-courts" @click="adminMobileOpen=false" class="block px-3 py-2 text-sm hover:bg-zinc-50" x-text="t('admin.courts')"></a>
    <a href="#admin-timetable" @click="adminMobileOpen=false" class="block px-3 py-2 text-sm hover:bg-zinc-50" x-text="t('admin.timetable')"></a>
    <a href="#admin-users" @click="adminMobileOpen=false" class="block px-3 py-2 text-sm hover:bg-zinc-50" x-text="t('admin.users')"></a>
    <a href="#admin-bookings" @click="adminMobileOpen=false" class="block px-3 py-2 text-sm hover:bg-zinc-50" x-text="t('admin.bookings')"></a>
    <a href="#admin-blocks" @click="adminMobileOpen=false" class="block px-3 py-2 text-sm hover:bg-zinc-50" x-text="t('admin.blocks.short')"></a>
    <a href="#admin-club" @click="adminMobileOpen=false" class="block px-3 py-2 text-sm hover:bg-zinc-50" x-text="t('admin.club.title')"></a>
     <a href="#admin-reports" @click="adminMobileOpen=false" class="block px-3 py-2 text-sm hover:bg-zinc-50" x-text="t('admin.reports.title')"></a>
     <a href="#admin-notifications" @click="adminMobileOpen=false" class="block px-3 py-2 text-sm hover:bg-zinc-50" x-text="t('admin.notifications.nav')"></a>
     <a href="#admin-announcements" @click="adminMobileOpen=false" class="block px-3 py-2 text-sm hover:bg-zinc-50" x-text="t('admin.ann.title')"></a>
   </div>
   </div>
  <div class="flex items-center gap-2">
  <template x-if="!user && clubLocales.length !== 1">
  <div class="flex items-center gap-2 relative">
  <button @click="headerLangOpen=!headerLangOpen" class="flex items-center gap-2 rounded-lg border bg-white px-4 py-2 text-sm font-medium">
  <img :src="flagUrl(lang)" class="h-3 w-4 object-cover rounded-sm" :alt="lang" />
  <span x-text="t('lang.'+lang)"></span>
  </button>
  <div x-show="headerLangOpen" @click.outside="headerLangOpen=false" class="absolute right-0 top-10 mt-1 w-44 rounded-lg border bg-white shadow-lg z-50 overflow-hidden">
  <template x-for="l in (clubLocales.length ? clubLocales : ['it','en','fr','de','es'])" :key="l">
 <button @click="setLang(l); headerLangOpen=false" class="flex w-full items-center gap-2 px-3 py-2 text-xs hover:bg-zinc-50 text-left">
 <img :src="flagUrl(l)" class="h-3 w-4 object-cover rounded-sm" :alt="l" />
 <span x-text="t('lang.'+l)"></span>
 </button>
 </template>
 </div>
 </div>
 </template>
 <a href="#profile" x-show="user" class="hidden text-sm font-medium text-zinc-700 hover:text-black md:inline" x-text="user?.username" @click.prevent="view='profile'; location.hash='profile'; loadProfile()"></a>
  <button x-show="!user && clubSlug" @click="view='login'" class="rounded-lg bg-emerald-200 border border-emerald-300 text-emerald-900 hover:bg-emerald-300 px-4 py-2 text-sm font-medium" x-text="t('nav.login')"></button>
 <button x-show="user" @click="logout()" class="rounded-lg border px-4 py-2 text-sm" x-text="t('nav.logout')"></button>
 </div>
 </div>
 </header>

  <nav x-show="clubSlug" class="fixed inset-x-0 bottom-0 z-30 flex border-t bg-white px-2 py-2 md:hidden">
  <a href="#courts" class="flex flex-1 flex-col items-center text-xs whitespace-nowrap" x-text="t('nav.courts')"></a>
  <a href="#me" class="flex flex-1 flex-col items-center text-xs whitespace-nowrap" x-text="t('nav.myBookings')"></a>
  <a href="#profile" x-show="user" class="flex flex-1 flex-col items-center text-xs whitespace-nowrap" x-text="t('nav.profile')"></a>
  </nav>

  <main class="mx-auto w-full max-w-6xl flex-1 px-4 py-6 pb-20 md:pb-6">
  <section x-show="view==='clubs'" class="space-y-6">
  <div class="hero-gradient rounded-2xl p-8">
  <h1 class="text-3xl font-bold md:text-4xl" x-text="t('landing.title')"></h1>
  <p class="mt-2 max-w-xl/90" x-text="t('landing.sub')"></p>
  <div class="mt-4 flex flex-wrap gap-2">
  <a href="#demo" @click.prevent="view='demo'" class="inline-block rounded-lg bg-white px-6 py-2 text-sm font-semibold text-emerald-700" x-text="t('landing.tryDemo')"></a>
  <a href="#clubs-dir" @click.prevent="document.getElementById('clubs-dir')?.scrollIntoView()" class="inline-block rounded-lg border border-white px-6 py-2 text-sm font-semibold text-white" x-text="t('landing.viewClubs')"></a>
  </div>
  </div>
  <div class="grid gap-3 md:grid-cols-3">
  <div class="rounded-xl border bg-white p-4"><div class="font-semibold" x-text="t('landing.f1')"></div></div>
  <div class="rounded-xl border bg-white p-4"><div class="font-semibold" x-text="t('landing.f2')"></div></div>
  <div class="rounded-xl border bg-white p-4"><div class="font-semibold" x-text="t('landing.f3')"></div></div>
  </div>
  <h2 class="text-xl font-bold" x-text="t('landing.pricing')"></h2>
  <div class="grid gap-3 md:grid-cols-3">
  <div class="rounded-xl border bg-white p-4"><div class="font-semibold" x-text="t('landing.pFree')"></div><div class="text-sm text-zinc-600" x-text="t('landing.pFreeD')"></div></div>
  <div class="rounded-xl border bg-white p-4"><div class="font-semibold" x-text="t('landing.pStarter')"></div><div class="text-sm text-zinc-600" x-text="t('landing.pStarterD')"></div></div>
  <div class="rounded-xl border bg-white p-4"><div class="font-semibold" x-text="t('landing.pPro')"></div><div class="text-sm text-zinc-600" x-text="t('landing.pProD')"></div></div>
  </div>
  <h2 class="text-xl font-bold" id="clubs-dir" x-text="t('landing.dir')"></h2>
  <div x-show="clubsLoading" class="text-sm text-zinc-500">…</div>
  <div class="space-y-3">
  <template x-for="c in clubsList" :key="c.slug">
  <a :href="`/club/${c.slug}/`" class="block rounded-xl border bg-white p-4 hover:border-emerald-300">
  <div class="font-semibold" x-text="c.name"></div>
  <div class="text-xs text-zinc-500" x-text="`/club/${c.slug}/`"></div>
  </a>
  </template>
  </div>
  <div x-show="!clubsLoading && !clubsList.length" class="text-sm text-zinc-500">No clubs yet.</div>
  </section>
  <section x-show="view==='demo'" class="mx-auto max-w-md space-y-4 rounded-xl border bg-white p-6">
  <h2 class="text-lg font-bold" x-text="t('demo.title')"></h2>
  <div x-show="!demoResult" class="space-y-3">
  <label class="block text-sm font-medium" x-text="t('demo.name')"></label>
  <div class="flex gap-2">
  <input x-model="demoForm.name" class="flex-1 rounded-lg border px-3 py-2 text-sm" />
  <button @click="surpriseDemoName()" class="rounded-lg border px-3 py-2 text-xs" x-text="t('demo.surprise')"></button>
  </div>
  <div class="grid grid-cols-2 gap-3">
  <label class="block text-sm"><span x-text="t('demo.tennis')"></span><input x-model.number="demoForm.tennis" type="number" min="0" max="6" class="mt-1 w-full rounded-lg border px-3 py-2" /></label>
  <label class="block text-sm"><span x-text="t('demo.padel')"></span><input x-model.number="demoForm.padel" type="number" min="0" max="6" class="mt-1 w-full rounded-lg border px-3 py-2" /></label>
  </div>
  <button @click="startDemo()" :disabled="demoLoading" class="w-full rounded-lg bg-emerald-200 border border-emerald-300 text-emerald-900 hover:bg-emerald-300 py-2 font-medium" x-text="t('demo.start')"></button>
  <div x-show="demoError" class="text-sm text-red-600" x-text="demoError"></div>
  </div>
  <div x-show="demoResult" class="space-y-2 text-sm">
  <div class="font-semibold" x-text="demoResult?.name"></div>
  <div><span class="text-zinc-500" x-text="t('demo.user') + ': '"></span><span class="font-mono" x-text="demoResult?.admin_username"></span></div>
  <div><span class="text-zinc-500" x-text="t('demo.pass') + ': '"></span><span class="font-mono" x-text="demoResult?.admin_password"></span></div>
  <div class="text-xs text-zinc-500" x-text="t('demo.expires') + ': ' + demoResult?.expires_at"></div>
  <a :href="demoResult?.url" class="inline-block rounded-lg bg-emerald-200 border border-emerald-300 text-emerald-900 px-6 py-2 font-medium" x-text="t('demo.open')"></a>
  </div>
  </section>
  <section x-show="view==='platform-login'" class="mx-auto max-w-sm space-y-4 rounded-xl border bg-white p-6">
  <h2 class="text-lg font-bold" x-text="t('platform.title')"></h2>
  <input x-model="platformForm.username" autocomplete="username" class="w-full rounded-lg border px-3 py-2 text-sm" />
  <input x-model="platformForm.password" type="password" autocomplete="current-password" class="w-full rounded-lg border px-3 py-2 text-sm" />
  <button @click="platformLogin()" class="w-full rounded-lg bg-emerald-200 border border-emerald-300 text-emerald-900 py-2 font-medium" x-text="t('platform.login')"></button>
  <div x-show="platformError" class="text-sm text-red-600 whitespace-pre-line" x-text="platformError"></div>
  </section>
  <section x-show="view==='platform-clubs'" class="space-y-4">
  <div class="flex flex-wrap items-center justify-between gap-2">
  <h2 class="text-xl font-bold" x-text="t('platform.clubs')"></h2>
  <div class="flex gap-2">
  <button @click="view='platform-new'" class="rounded-lg bg-emerald-200 border border-emerald-300 text-emerald-900 px-4 py-2 text-sm" x-text="t('platform.new')"></button>
  <button @click="view='platform-audit'; loadPlatformAudit()" class="rounded-lg border px-4 py-2 text-sm" x-text="t('platform.audit')"></button>
  <button @click="ensureDemo()" class="rounded-lg border px-4 py-2 text-sm" x-text="t('platform.ensure')"></button>
  <button @click="resetDemo()" class="rounded-lg border px-4 py-2 text-sm" x-text="t('platform.resetDemo')"></button>
  <button @click="cleanupDemos()" class="rounded-lg border px-4 py-2 text-sm" x-text="t('platform.cleanup')"></button>
  <button @click="platformLogout()" class="rounded-lg border px-4 py-2 text-sm" x-text="t('nav.logout')"></button>
  </div>
  </div>
  <div x-show="platformError" class="text-sm text-red-600 whitespace-pre-line rounded-lg border border-red-200 bg-red-50 p-3" x-text="platformError"></div>
  <div class="space-y-3">
  <template x-for="c in platformClubs" :key="c.id">
  <div class="rounded-xl border bg-white p-4">
  <div class="flex flex-wrap items-center justify-between gap-2">
  <div><a :href="`/club/${c.slug}/`" class="font-semibold underline" x-text="`${c.name} · /c/${c.slug}/`"></a>
  <div class="text-xs text-zinc-500" x-text="`${c.timezone} · ${c.plan} · courts ${c.counts?.courts ?? '?'} · users ${c.counts?.users ?? '?'} · bookings ${c.counts?.bookings ?? '?'}`"></div></div>
  <div class="flex flex-wrap items-center gap-2 text-xs">
  <select x-model="c.plan" @change="savePlatformClub(c)" class="rounded-lg border px-2 py-1"><option value="free">free</option><option value="starter">starter</option><option value="pro">pro</option></select>
  <label class="flex items-center gap-1"><input type="checkbox" x-model="c.is_active" @change="savePlatformClub(c)" /><span x-text="t('platform.active')"></span></label>
  <label class="flex items-center gap-1"><input type="checkbox" x-model="c.is_listed" @change="savePlatformClub(c)" /><span x-text="t('platform.listed')"></span></label>
  <button @click="savePlatformClub(c)" class="rounded-lg border px-2 py-1" x-text="t('platform.save')"></button>
  </div>
  </div>
  </div>
  </template>
  </div>
  </section>
  <section x-show="view==='platform-new'" class="mx-auto max-w-md space-y-3 rounded-xl border bg-white p-6">
  <h2 class="text-lg font-bold" x-text="t('platform.new')"></h2>
  <label class="block text-sm"><span x-text="t('platform.name')"></span><input x-model="platformNew.name" class="mt-1 w-full rounded-lg border px-3 py-2" /></label>
  <label class="block text-sm"><span x-text="t('platform.slug')"></span><input x-model="platformNew.slug" placeholder="auto" class="mt-1 w-full rounded-lg border px-3 py-2" /></label>
  <label class="block text-sm"><span x-text="t('platform.timezone')"></span><input x-model="platformNew.timezone" class="mt-1 w-full rounded-lg border px-3 py-2" /></label>
  <label class="block text-sm"><span x-text="t('platform.plan')"></span><select x-model="platformNew.plan" class="mt-1 w-full rounded-lg border px-3 py-2"><option value="free">free</option><option value="starter">starter</option><option value="pro">pro</option></select></label>
  <label class="block text-sm"><span x-text="t('platform.adminUser')"></span><input x-model="platformNew.admin_username" class="mt-1 w-full rounded-lg border px-3 py-2" /></label>
  <label class="block text-sm"><span x-text="t('platform.adminEmail')"></span><input x-model="platformNew.admin_email" type="email" class="mt-1 w-full rounded-lg border px-3 py-2" /></label>
  <label class="block text-sm"><span x-text="t('platform.adminPass')"></span><input x-model="platformNew.admin_password" type="password" class="mt-1 w-full rounded-lg border px-3 py-2" /></label>
  <button @click="createPlatformClub()" class="w-full rounded-lg bg-emerald-200 border border-emerald-300 text-emerald-900 py-2 font-medium" x-text="t('platform.create')"></button>
  <div x-show="platformError" class="text-sm text-red-600 whitespace-pre-line" x-text="platformError"></div>
  <button @click="view='platform-clubs'" class="w-full text-sm text-zinc-600" x-text="t('platform.back')"></button>
  </section>
  <section x-show="view==='platform-audit'" class="space-y-3">
  <div class="flex items-center justify-between"><h2 class="text-xl font-bold" x-text="t('platform.audit')"></h2><button @click="view='platform-clubs'" class="rounded-lg border px-4 py-2 text-sm" x-text="t('platform.back')"></button></div>
  <template x-for="a in platformAudit" :key="a.id">
  <div class="rounded-xl border bg-white p-3 text-xs"><span class="font-mono" x-text="a.created_at"></span><span class="font-semibold" x-text="' ' + a.action"></span><span x-text="' ' + (a.club_slug || a.target || '')"></span></div>
  </template>
  </section>
  <section x-show="view==='home'" class="space-y-6">
   <div class="hero-gradient rounded-2xl p-8">
   <h1 class="text-3xl font-bold md:text-4xl" x-text="t('hero.title')"></h1>
   <p class="mt-2 max-w-xl/90" x-text="t('hero.subtitle')"></p>
   <a href="#courts" @click.prevent="view='courts'; loadCourts()" class="mt-4 inline-block rounded-lg bg-white px-6 py-2 text-sm font-semibold text-emerald-700" x-text="t('hero.cta')"></a>
   </div>
   <div x-show="annLoading" class="text-sm text-zinc-500" x-text="t('myBookings.loading')"></div>
   <div x-show="!annLoading && announcements.length" class="space-y-3">
   <template x-for="a in announcements" :key="a.id">
   <article class="rounded-xl border bg-white p-4">
   <div class="font-semibold" x-text="a.title"></div>
   <p class="mt-1 text-sm text-zinc-700 whitespace-pre-line" x-text="a.body"></p>
   </article>
   </template>
   </div>
    </section>

 <section x-show="view==='courts'" class="space-y-4">
 <div class="flex flex-wrap items-center justify-between gap-2">
 <h2 class="text-xl font-bold" x-text="t('courts.title')"></h2>
 <div class="flex gap-2">
 <select x-model="filterType" @change="loadAvailability()" class="rounded-lg border px-3 py-2 text-sm">
 <option value="" x-text="t('filter.all')"></option><option value="tennis">Tennis</option><option value="padel">Padel</option>
 </select>
  <input type="date" x-model="selectedDate" @change="loadAvailability()" :min="new Date().toLocaleDateString('en-CA', { timeZone: 'Europe/Rome' })" class="rounded-lg border px-3 py-2 text-sm" />
 </div>
 </div>
 <div x-show="user?.role==='admin' && timetableAdminSelected" class="rounded-xl border p-4 flex flex-wrap items-center justify-between gap-2" :class="timetableAdminSelected?.status==='pending_approval' ? 'border-amber-300 bg-amber-50' : 'border-red-300 bg-red-50'">
 <div class="text-sm">
 <div class="font-semibold" x-text="`${timetableAdminSelected?.status==='pending_approval' ? 'Pending' : 'Booked'}: ${timetableAdminSelected?.courtId ? (courts.find(c=>c.id===timetableAdminSelected.courtId)?.name || (courts.find(c=>c.id===timetableAdminSelected.courtId)?.number ? 'Court ' + courts.find(c=>c.id===timetableAdminSelected.courtId).number : '' ) || timetableAdminSelected.courtId.slice(0,8)) : ''} · ${timetableAdminSelected?.date} ${timetableAdminSelected?.startTime}`"></div>
 <div class="text-xs text-zinc-600" x-text="t('status.'+timetableAdminSelected?.status)"></div>
 </div>
 <div class="flex gap-2">
 <button x-show="timetableAdminSelected?.status==='pending_approval'" @click="timetableApprove()" class="rounded-lg bg-emerald-200 border border-emerald-300 text-emerald-900 hover:bg-emerald-300 px-4 py-2 text-xs font-medium" x-text="t('btn.approve')"></button>
 <button @click="timetableReject()" class="rounded-lg border bg-white px-4 py-2 text-xs" x-text="t('btn.reject')"></button>
 <button @click="timetableAdminSelected=null" class="rounded-lg border bg-white px-3 py-2 text-xs">×</button>
 </div>
 </div>
 <div class="grid gap-3 md:grid-cols-2">
 <template x-for="court in filteredCourts()" :key="court.id">
 <div class="rounded-xl border bg-white p-4">
 <div class="flex items-center justify-between">
  <div><div class="font-semibold" x-text="`${court.name || `Court ${court.number}`} · ${court.type}`"></div><div class="text-xs text-zinc-500" x-text="court.name ? `#${court.number} · ${court.surface || court.type}` : (court.surface || '')"></div><div class="text-xs font-medium text-emerald-700" x-show="fmtPrice(court.base_price_cents)" x-text="fmtPrice(court.base_price_cents) + ' / ' + t('price.slot')"></div></div>
 <span class="rounded-lg px-2 py-1 text-xs" :class="court.is_active ? 'bg-emerald-100 text-emerald-700' : 'bg-zinc-100'"> <span x-text="court.is_active ? t('court.active') : t('court.inactive')"></span></span>
 </div>
 <div class="mt-3 grid grid-cols-4 gap-2">
 <template x-for="slot in availability[court.id] || []" :key="slot.start">
 <button
 @click="selectSlot(court, slot)"
 :disabled="isPastSlot(slot) || (slot.status!=='available' && !(user?.role==='admin' && (slot.status==='pending_approval' || slot.status==='booked')))"
 class="rounded-lg border px-2 py-2 text-xs font-medium"
 :class="isPastSlot(slot) ? 'bg-zinc-100 text-zinc-400 cursor-not-allowed' : ((slot.bookingUserId && user && String(slot.bookingUserId)===String(user.id) && (slot.status==='booked' || slot.status==='pending_approval') ? ' border-2 !border-red-700 ring-1 ring-red-700 font-bold ' : '') + (slot.status==='available' ? 'bg-emerald-50 hover:bg-emerald-100 border-emerald-200' : slot.status==='booked' ? 'bg-red-50 text-red-700 border-red-200 hover:bg-red-100' : slot.status==='pending_approval' ? 'bg-amber-100 text-amber-700 border-amber-300 hover:bg-amber-200' : slot.status==='lesson' ? 'bg-red-50 text-red-700 border-red-200' : slot.status==='blocked' ? 'bg-red-50 text-red-700 border-red-200' : 'bg-zinc-100 text-zinc-400'))"
 :title="slot.label || ''"
 x-text="(slot.bookingUserId && user && String(slot.bookingUserId)===String(user.id) && (slot.status==='booked' || slot.status==='pending_approval') ? '★ ' : '') + (slot.status==='lesson' ? `${t('status.unavailable')}: ${slot.label || t('status.blocked')}` : slot.status==='blocked' ? `${t('status.unavailable')}: ${slot.label || t('status.blocked')}` : `${slot.start} ${slot.status==='available' ? '✓' : t('status.'+slot.status)}${user?.role==='admin' && slot.bookingUsername ? ' [' + slot.bookingUsername + ']' : ''}`)"
 ></button>
 </template>
 </div>
 </div>
 </template>
 </div>
 </section>

   <span x-show="reportsLoading" class="text-xs text-zinc-500 py-2" x-text="t('myBookings.loading')"></span>
   </div>
   <p x-show="reportsError" class="text-sm text-red-600" x-text="reportsError"></p>
   <template x-if="reportsData">
   <div class="space-y-4">
   <div class="rounded-xl border bg-white p-4">
   <div class="text-sm text-zinc-500" x-text="`${t('admin.reports.period')}: ${reportsData.startDate} → ${reportsData.endDate}`"></div>
   <div class="mt-1 text-2xl font-bold" x-text="`${t('admin.reports.overall')}: ${reportsData.overall}`"></div>
   </div>
     <div class="rounded-xl border bg-white p-4">
     <div class="font-semibold mb-2" x-text="t('admin.reports.overall') + ' — ' + t('admin.reports.period') + ' chart'"></div>
     <div class="flex items-end gap-1 h-48 border-b border-zinc-200 pb-1 overflow-x-auto">
     <template x-for="row in reportsData.timeline" :key="row.label">
     <div @click="selectSlice(row)" class="flex-1 flex flex-col items-center gap-1 min-w-[28px] cursor-pointer hover:opacity-80" :class="(reportsSliceData ? row.label===reportsSelectedLabel : row.startDate===reportsData.startDate) ? 'ring-1 ring-zinc-900 rounded' : ''">
     <span class="text-xs font-mono" x-text="row.count"></span>
     <div class="w-full bg-zinc-100 rounded-t overflow-hidden flex items-end" style="height: 120px">
     <div class="w-full rounded-t" :class="(reportsSliceData ? row.label===reportsSelectedLabel : row.startDate===reportsData.startDate) ? 'bg-emerald-600' : 'bg-emerald-300'" :style="`height: ${row.count===0 ? 0 : Math.max(8, (row.count / Math.max(...reportsData.timeline.map(r=>r.count),1))*100)}%`"></div>
     </div>
     <span class="text-[10px] truncate w-full text-center" x-text="row.label"></span>
     </div>
     </template>
     </div>
     </div>
      <div class="rounded-xl border bg-white p-4">
      <div class="font-semibold mb-2" x-text="t('admin.reports.byUser') + ' — ' + (reportsSliceData ? reportsSliceData.startDate + ' → ' + reportsSliceData.endDate : reportsData.startDate + ' → ' + reportsData.endDate)"></div>
     <p x-show="(reportsSliceData ? reportsSliceData.byUser : reportsData.byUser).length===0" class="text-xs text-zinc-500" x-text="t('admin.reports.noData')"></p>
     <template x-for="row in (reportsSliceData ? reportsSliceData.byUser : reportsData.byUser)" :key="row.userId">
     <div class="flex justify-between border-b py-1 text-sm">
     <span x-text="row.username"></span><span class="font-mono font-bold" x-text="row.count"></span>
     </div>
     </template>
     </div>
      <div class="rounded-xl border bg-white p-4">
      <div class="font-semibold mb-2" x-text="t('admin.reports.cancellations') + ' — ' + (reportsSliceData ? reportsSliceData.startDate + ' → ' + reportsSliceData.endDate : reportsData.startDate + ' → ' + reportsData.endDate)"></div>
     <p x-show="(reportsSliceData ? reportsSliceData.cancellationsByUser : reportsData.cancellationsByUser).length===0" class="text-xs text-zinc-500" x-text="t('admin.reports.noData')"></p>
    <template x-for="row in (reportsSliceData ? reportsSliceData.cancellationsByUser : reportsData.cancellationsByUser)" :key="row.userId">
    <div class="flex justify-between border-b py-1 text-sm">
    <span x-text="row.username"></span><span class="font-mono font-bold text-red-600" x-text="row.count"></span>
    </div>
    </template>
    </div>
   </div>
   </template>
   </section>

  <section x-show="view==='admin-notifications'" class="mx-auto max-w-2xl space-y-4 rounded-xl border bg-white p-6" x-init="if(user?.role==='admin') loadAdminSettings()">
  <h2 class="text-xl font-bold" x-text="t('admin.notifications.title')"></h2>
  <p class="text-xs text-zinc-500" x-text="t('admin.notifications.desc')"></p>
  <label class="flex items-center gap-2 text-sm"><input type="checkbox" x-model="notificationForm.notifications_enabled" /> <span x-text="t('admin.notifications.enable')"></span></label>
  <label class="flex items-center gap-2 text-sm" :class="!notificationForm.notifications_enabled ? 'opacity-50' : ''"><input type="checkbox" x-model="notificationForm.notify_on_auto_approved" :disabled="!notificationForm.notifications_enabled" /> <span x-text="t('admin.notifications.notifyOnAutoApproved')"></span></label>
  <label class="flex items-center gap-2 text-sm" :class="!notificationForm.notifications_enabled ? 'opacity-50' : ''"><input type="checkbox" x-model="notificationForm.notify_on_approval" :disabled="!notificationForm.notifications_enabled" /> <span x-text="t('admin.notifications.notifyOnApproval')"></span></label>
  <label class="flex items-center gap-2 text-sm" :class="!notificationForm.notifications_enabled ? 'opacity-50' : ''"><input type="checkbox" x-model="notificationForm.notify_on_rejection" :disabled="!notificationForm.notifications_enabled" /> <span x-text="t('admin.notifications.notifyOnRejection')"></span></label>
  <label class="flex items-center gap-2 text-sm" :class="!notificationForm.notifications_enabled ? 'opacity-50' : ''"><input type="checkbox" x-model="notificationForm.notify_via_telegram" :disabled="!notificationForm.notifications_enabled" /> <span x-text="t('admin.notifications.viaTelegram')"></span></label>
  <label class="flex items-center gap-2 text-sm" :class="!notificationForm.notifications_enabled ? 'opacity-50' : ''"><input type="checkbox" x-model="notificationForm.notify_via_whatsapp" :disabled="!notificationForm.notifications_enabled" /> <span x-text="t('admin.notifications.viaWhatsapp')"></span></label>
  <div class="space-y-3 border-t pt-4">
  <h3 class="font-semibold text-sm" x-text="t('admin.notifications.telegram.title')"></h3>
  <div class="rounded-lg border p-3 space-y-2 bg-zinc-50">
  <div class="flex items-center justify-between text-sm"><span class="font-medium" x-text="t('admin.notifications.telegram.subscribeTitle')"></span><span class="text-xs" :class="telegramLinked ? 'text-emerald-600' : 'text-zinc-500'" x-text="telegramLinked ? t('telegram.connected') : t('telegram.notConnected')"></span></div>
  <p class="text-[11px] text-zinc-500" x-text="t('admin.notifications.telegram.subscribeDesc')"></p>
  <button x-show="!telegramLinked" @click="createTelegramLink()" :disabled="telegramLinkLoading" class="w-full rounded-lg bg-emerald-200 border border-emerald-300 text-emerald-900 py-2 text-xs font-medium" x-text="telegramLinkLoading ? t('telegram.linking') : t('telegram.connect')"></button>
  <button x-show="telegramLinked" @click="unlinkTelegram()" class="w-full rounded-lg border bg-white py-2 text-xs" x-text="t('telegram.disconnect')"></button>
  <p x-show="telegramLinkUrl" class="text-xs break-all"><a :href="telegramLinkUrl" target="_blank" class="underline text-emerald-700" x-text="telegramLinkUrl"></a></p>
  </div>
  <input x-model="notificationForm.telegram_bot_token" :placeholder="t('admin.notifications.telegram.tokenPlaceholder')" class="w-full rounded-lg border px-3 py-2 text-sm font-mono" />
  <p x-show="adminSettings?.telegram_bot_token_present" class="text-xs text-emerald-600"><span x-text="t('admin.notifications.telegram.saved')"></span><span x-text="adminSettings?.telegram_bot_token"></span></p>
  <input x-model="notificationForm.telegram_admin_chat_id" :placeholder="t('admin.notifications.telegram.chatIdPlaceholder')" class="w-full rounded-lg border px-3 py-2 text-sm" />
  <button @click="testNotification('telegram')" class="rounded-lg border bg-white px-3 py-1 text-xs" x-text="t('admin.notifications.telegram.test')"></button>
  </div>
  <div class="space-y-3 border-t pt-4">
  <h3 class="font-semibold text-sm" x-text="t('admin.notifications.whatsapp.title')"></h3>
  <p class="text-xs text-zinc-500" x-text="t('admin.notifications.whatsapp.desc')"></p>
  <input x-model="notificationForm.whatsapp_token" :placeholder="t('admin.notifications.whatsapp.tokenPlaceholder')" class="w-full rounded-lg border px-3 py-2 text-sm font-mono" />
  <p x-show="adminSettings?.whatsapp_token_present" class="text-xs text-emerald-600" x-text="t('admin.notifications.whatsapp.saved')"></p>
  <input x-model="notificationForm.whatsapp_phone_number_id" :placeholder="t('admin.notifications.whatsapp.phoneIdPlaceholder')" class="w-full rounded-lg border px-3 py-2 text-sm font-mono" />
  <input x-model="notificationForm.whatsapp_admin_phone" :placeholder="t('admin.notifications.whatsapp.adminPhonePlaceholder')" class="w-full rounded-lg border px-3 py-2 text-sm" />
  <p class="text-xs text-zinc-500" x-text="t('admin.notifications.whatsapp.usersHint')"></p>
  <button @click="testNotification('whatsapp')" class="rounded-lg border bg-white px-3 py-1 text-xs" x-text="t('admin.notifications.whatsapp.test')"></button>
  </div>
  <button @click="saveNotificationSettings()" class="w-full rounded-lg bg-emerald-200 border border-emerald-300 text-emerald-900 hover:bg-emerald-300 py-2 text-sm font-medium" x-text="t('admin.notifications.save')"></button>
  <pre x-show="notificationTestResult" class="text-xs bg-zinc-50 border rounded p-2 whitespace-pre-wrap break-all" x-text="notificationTestResult"></pre>
  </section>

  <section x-show="view==='admin-announcements'" class="mx-auto max-w-2xl space-y-4 rounded-xl border bg-white p-6" x-init="if(user?.role==='admin') loadAdminAnnouncements()">
  <div class="flex items-center gap-2">
  <h2 class="text-xl font-bold" x-text="t('admin.ann.title')"></h2>
  <button @click="newAnnouncement()" class="ml-auto rounded bg-emerald-200 border border-emerald-300 text-emerald-900 hover:bg-emerald-300 px-3 py-1 text-xs" x-text="t('admin.ann.new')"></button>
  </div>
  <p class="text-xs text-zinc-500" x-text="t('admin.ann.desc')"></p>
  <p x-show="adminAnnLoading" class="text-sm text-zinc-500" x-text="t('myBookings.loading')"></p>
  <p x-show="adminAnnError" class="text-sm text-red-600 whitespace-pre-line" x-text="adminAnnError"></p>
  <p x-show="adminAnnSuccess" class="text-sm text-emerald-600" x-text="adminAnnSuccess"></p>
  <p x-show="!adminAnnLoading && adminAnns.length===0" class="text-xs text-zinc-500 text-center" x-text="t('admin.ann.empty')"></p>
  <div class="space-y-2">
  <template x-for="(a, i) in adminAnns" :key="a.id">
  <div class="rounded-xl border bg-white px-3 py-2">
  <div class="grid grid-cols-[1fr_auto] items-start gap-2">
  <div class="grid gap-0.5 text-sm">
  <div class="font-semibold leading-tight" x-text="a.title"></div>
  <div class="text-xs text-zinc-500" x-text="(a.publish_start || '…') + ' → ' + (a.publish_end || '…')"></div>
  <div class="flex gap-1">
  <span class="rounded-lg px-2 py-0.5 text-[11px] font-medium" :class="a.visibility==='members' ? 'bg-emerald-100 text-emerald-700' : 'bg-zinc-100 text-zinc-600'" x-text="a.visibility==='members' ? t('admin.ann.members') : t('admin.ann.public')"></span>
  <span class="rounded-lg px-2 py-0.5 text-[11px] font-medium" :class="annStatus(a)==='active' ? 'bg-emerald-100 text-emerald-700' : annStatus(a)==='scheduled' ? 'bg-amber-100 text-amber-700' : 'bg-zinc-200 text-zinc-600'" x-text="annStatus(a)==='active' ? t('admin.ann.active') : annStatus(a)==='scheduled' ? t('admin.ann.scheduled') : t('admin.ann.expired')"></span>
  </div>
  <p class="text-xs text-zinc-600 whitespace-pre-line" x-text="a.body"></p>
  </div>
  <div class="flex flex-col items-end gap-1">
  <div class="flex gap-1">
  <button @click="moveAnnouncement(a.id, -1)" :disabled="i===0" :title="t('admin.ann.moveUp')" class="rounded-lg border bg-white px-2 py-1 text-xs disabled:opacity-40">▲</button>
  <button @click="moveAnnouncement(a.id, 1)" :disabled="i===adminAnns.length-1" :title="t('admin.ann.moveDown')" class="rounded-lg border bg-white px-2 py-1 text-xs disabled:opacity-40">▼</button>
  </div>
  <div class="flex gap-1">
  <button @click="startEditAnnouncement(a)" class="rounded-lg border bg-white px-2 py-1 text-xs" x-text="t('btn.edit')"></button>
  <button @click="deleteAnnouncement(a.id)" class="rounded-lg border bg-white px-2 py-1 text-xs text-red-600" x-text="t('btn.delete')"></button>
  </div>
  </div>
  </div>
  </div>
  </template>
  </div>
  </section>

  <section x-show="view==='admin-announcement-form'" class="mx-auto max-w-2xl space-y-4 rounded-xl border bg-white p-6">
  <div class="flex items-center gap-2">
  <button @click="view='admin-announcements'; location.hash='admin-announcements'" class="rounded-lg border bg-white px-3 py-1 text-xs" x-text="t('btn.back')"></button>
  <h2 class="text-xl font-bold" x-text="editingAnnId ? t('admin.ann.edit') : t('admin.ann.new')"></h2>
  </div>
  <p x-show="adminAnnError" class="text-sm text-red-600 whitespace-pre-line" x-text="adminAnnError"></p>
  <p x-show="adminAnnSuccess" class="text-sm text-emerald-600" x-text="adminAnnSuccess"></p>
  <div class="space-y-3">
  <input x-model="annForm.title" :placeholder="t('admin.ann.titlePh')" class="w-full rounded-lg border px-3 py-2 text-sm" />
  <textarea x-model="annForm.body" rows="3" :placeholder="t('admin.ann.bodyPh')" class="w-full rounded-lg border px-3 py-2 text-sm"></textarea>
  <template x-for="l in ['en','fr','de','es']" :key="l">
  <div class="space-y-2 border-t pt-2">
  <div class="flex items-center gap-2 text-xs font-medium"><img :src="flagUrl(l)" class="h-3 w-4 object-cover rounded-sm" :alt="l" /><span x-text="t('lang.'+l)"></span><span class="text-zinc-400 font-normal" x-text="'(' + t('common.optional') + ')'"></span></div>
  <input x-model="annForm.tr[l].title" :placeholder="t('admin.ann.titlePh')" class="w-full rounded-lg border px-3 py-2 text-sm" />
  <textarea x-model="annForm.tr[l].body" rows="2" :placeholder="t('admin.ann.bodyPh')" class="w-full rounded-lg border px-3 py-2 text-sm"></textarea>
  </div>
  </template>
  <div>
  <label class="text-xs text-zinc-500" x-text="t('admin.ann.visibility')"></label>
  <select x-model="annForm.visibility" class="w-full rounded-lg border px-3 py-2 text-sm">
  <option value="public" x-text="t('admin.ann.public')"></option>
  <option value="members" x-text="t('admin.ann.members')"></option>
  </select>
  </div>
  <div class="grid grid-cols-2 gap-2">
  <div>
  <label class="text-xs text-zinc-500" x-text="t('admin.ann.start')"></label>
  <input type="date" x-model="annForm.publish_start" class="w-full rounded-lg border px-3 py-2 text-sm" />
  </div>
  <div>
  <label class="text-xs text-zinc-500" x-text="t('admin.ann.end')"></label>
  <input type="date" x-model="annForm.publish_end" class="w-full rounded-lg border px-3 py-2 text-sm" />
  </div>
  </div>
  <div class="flex gap-2">
  <button x-show="!editingAnnId" @click="createAnnouncement()" class="flex-1 rounded-lg bg-emerald-200 border border-emerald-300 text-emerald-900 hover:bg-emerald-300 py-2 text-sm font-medium" x-text="t('btn.create')"></button>
  <button x-show="editingAnnId" @click="updateAnnouncement()" class="flex-1 rounded-lg bg-emerald-200 border border-emerald-300 text-emerald-900 hover:bg-emerald-300 py-2 text-sm font-medium" x-text="t('btn.update')"></button>
  <button @click="cancelEditAnnouncement()" class="rounded-lg border bg-white px-4 py-2 text-sm" x-text="t('btn.cancel')"></button>
  </div>
  </div>
  </section>
   </main>

   <footer class="site-footer px-4 py-4 text-center text-xs text-zinc-500" x-text="clubInfo ? `${clubInfo.club_name || 'Green Village'} - tel. ${clubInfo.club_phone || '3923047417'}${clubInfo.club_address ? ' - ' + clubInfo.club_address : ''}` : t('footer')"></footer>
 </div>
 <script type="module" src="/src/main.ts"></script>
 </body>
</html>
